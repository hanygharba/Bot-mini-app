<script>
        // 1. تهيئة تطبيق تيليجرام
        let tg = window.Telegram.WebApp;
        tg.expand();

        // استخراج معرف المستخدم من تيليجرام
        const userId = tg.initDataUnsafe?.user?.id;

        // دالة تغيير حالة المشاهدة
        function toggleStatus(button, videoId) {
            if (button.classList.contains('completed')) {
                button.classList.remove('completed');
                button.innerText = 'تمت المشاهدة ✓';
                button.style.backgroundColor = '#3a3a3c';
                // هنا يمكننا مستقبلاً إرسال طلب للـ API لإزالة المشاهدة
            } else {
                button.classList.add('completed');
                button.innerText = 'تمت المشاهدة ✓ (مكتمل)';
                button.style.backgroundColor = '#2a9d8f';
                // هنا يمكننا مستقبلاً إرسال طلب للـ API لتسجيل المشاهدة
            }
        }

        // دالة بناء واجهة الفيديوهات ديناميكياً
        async function loadPlaylists() {
            if (!userId) {
                document.body.innerHTML = "<h3 style='text-align:center;'>عذراً، يرجى فتح التطبيق من داخل تيليجرام.</h3>";
                return;
            }

            try {
                // استدعاء البيانات من السيرفر (سنقوم ببرمجة هذا الرابط لاحقاً)
                const response = await fetch(`https://your-server-domain.com/api/playlist/${userId}`);
                const data = await response.json();

                const container = document.body;
                
                // تنظيف المحتوى الحالي وبناء القائمة العاجلة
                container.innerHTML = `
                    <div class="header">
                        <h2>قائمتك الاستشارية المخصصة</h2>
                        <p>القائمة العاجلة بناءً على تشخيص مشروعك</p>
                    </div>
                `;

                // بناء بطاقة لكل فيديو في القائمة المختصرة
                data.short_playlist.forEach((video, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="video-title">${index + 1}. ${video.title}</div>
                        <div class="video-container">
                            <div style="position:relative;padding-top:56.25%;">
                                <iframe src="${video.link}?autoplay=false&loop=false&muted=false&preload=false&responsive=true" 
                                    loading="lazy"
                                    style="border:0;position:absolute;top:0;height:100%;width:100%;"
                                    allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;" 
                                    allowfullscreen="true">
                                </iframe>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-status" onclick="toggleStatus(this, ${video.id})">علامة كـ مقروء ✓</button>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Error loading playlist:", error);
            }
        }

        // تشغيل الدالة عند تحميل الصفحة
        window.onload = loadPlaylists;
    </script>
