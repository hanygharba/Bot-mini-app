<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطة الاستشارة وقائمة التشغيل</title>
    <!-- مكتبة تليجرام الرسمية للـ Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f9);
            --text-color: var(--tg-theme-text-color, #222);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --accent-color: var(--tg-theme-button-color, #2481cc);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --border-color: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 5px 0;
            font-size: 20px;
        }
        .header p {
            font-size: 13px;
            color: #777;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }
        .video-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-watch {
            background-color: var(--accent-color);
            color: var(--accent-text);
            text-decoration: none;
            text-align: center;
            display: block;
        }
        .btn-status {
            background-color: #e9ecef;
            color: #495057;
        }
        .btn-status.completed {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>قائمتك الاستشارية المخصصة</h2>
        <p>بناءً على تشخيص مرحلة مشروعك</p>
    </div>

    <!-- مثال لفيديو رقم 1 -->
    <div class="card">
        <div class="video-title">1. كيف تحدد مرحلة مشروعي بدقة؟</div>
        <div class="actions">
            <a href="https://t.me/c/2548134216/20" class="btn btn-watch" target="_blank">مشاهدة الفيديو</a>
            <button class="btn btn-status completed" onclick="toggleStatus(this)">تمت المشاهدة ✓</button>
        </div>
    </div>

    <!-- مثال لفيديو رقم 2 -->
    <div class="card">
        <div class="video-title">2. هيكلة الإدارة وفخ التشغيل اليومي</div>
        <div class="actions">
            <a href="https://t.me/c/2548134216/55" class="btn btn-watch" target="_blank">مشاهدة الفيديو</a>
            <button class="btn btn-status" onclick="toggleStatus(this)">للمشاهدة لاحقاً</button>
        </div>
    </div>

    <script>
        // تفعيل إعدادات الثيم الخاص بتليجرام تلقائياً
        let tg = window.Telegram.WebApp;
        tg.expand();

        // دالة تجريبية لتغيير حالة الزر عند الضغط عليه
        function toggleStatus(button) {
            if (button.classList.contains('completed')) {
                button.classList.remove('completed');
                button.innerText = 'للمشاهدة لاحقاً';
                button.style.backgroundColor = '#e9ecef';
                button.style.color = '#495057';
            } else {
                button.classList.add('completed');
                button.innerText = 'تمت المشاهدة ✓';
                button.style.backgroundColor = '#d4edda';
                button.style.color = '#155724';
            }
        }
    </script>
</body>
</html>
