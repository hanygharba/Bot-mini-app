<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمتك الاستشارية المخصصة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1f2937;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 5px 0;
            font-size: 18px;
        }
        .header p {
            font-size: 12px;
            color: #9ca3af;
            margin: 0;
        }
        .card {
            background-color: #374151;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #4b5563;
        }
        .video-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        video {
            width: 100%;
            height: 180px;
            background-color: #111827;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .btn-status {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            background-color: #4b5563;
            color: #ffffff;
        }
        .btn-status.completed {
            background-color: #065f46;
            color: #d1fae5;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>قائمتك الاستشارية المخصصة</h2>
        <p>شاهد الفيديوهات وتابع تقدمك مباشرة من هنا</p>
    </div>

    <!-- كارت الفيديو الأول -->
    <div class="card">
        <div class="video-title">1. كيف تحدد مرحلة مشروعي بدقة؟</div>
        <video controls preload="metadata" data-file-id="BAACAgQAAxkBAAEENLxqyBD7veWutQ0VVWernDQmTvgg1gAChSAAAjPGOVJktkTiVXVeGT0E">
            <!-- مسار مؤقت للبث المباشر من سيرفر البوت أو تليجرام -->
            متصفحك لا يدعم عرض الفيديو.
        </video>
        <button class="btn-status" onclick="toggleStatus(this)">تمت المشاهدة ✓</button>
    </div>

    <!-- كارت الفيديو الثاني -->
    <div class="card">
        <div class="video-title">2. هيكلة الإدارة وفخ التشغيل اليومي</div>
        <video controls preload="metadata" data-file-id="BAACAgQAAxkBAAEENL9qyBE9tKjd9d_5bNgQB0tjsc7DTwACjhwAAvKuMVIN13z4KC67eD0E">
            متصفحك لا يدعم عرض الفيديو.
        </video>
        <button class="btn-status" onclick="toggleStatus(this)">تمت المشاهدة ✓</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function toggleStatus(button) {
            if (button.classList.contains('completed')) {
                button.classList.remove('completed');
                button.innerText = 'تمت المشاهدة ✓';
                button.style.backgroundColor = '#4b5563';
                button.style.color = '#ffffff';
            } else {
                button.classList.add('completed');
                button.innerText = 'تمت المشاهدة (مكتمل) ✓';
                button.style.backgroundColor = '#065f46';
                button.style.color = '#d1fae5';
            }
        }
    </script>
</body>
</html>
