<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطة الاستشارة وقائمة التشغيل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1d);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --accent-color: var(--tg-theme-button-color, #2a9d8f);
            --fav-color: #f39c12;
            --border-color: #3a3a3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 5px 0; font-size: 20px; }
        
        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 6px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .tab-btn.fav-tab {
            flex: 0.55;
            font-size: 15px;
        }
        .tab-btn.active { background-color: var(--accent-color); color: #fff; }
        .tab-btn.fav-tab.active { background-color: var(--fav-color); color: #fff; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .group-summary {
            background-color: #3a3a3c; color: white; padding: 12px; border-radius: 8px;
            cursor: pointer; font-weight: bold; margin-bottom: 10px; display: block; outline: none;
        }
        details { margin-bottom: 15px; }
        details[open] summary ~ * { animation: sweep .3s ease-in-out; }
        
        .card {
            background-color: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid var(--border-color);
        }
        .video-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; line-height: 1.4; }
        .video-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            background-color: #000;
            display: block;
        }
        video { width: 100%; display: block; outline: none; }
        
        .actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn {
            flex: 1; min-width: 30%; padding: 10px; border: none; border-radius: 8px;
            font-size: 13px; cursor: pointer; font-weight: 500; transition: 0.2s;
            background-color: #3a3a3c; color: #ffffff;
        }
        .btn.watched.active { background-color: var(--accent-color); }
        .btn.fav.active { background-color: var(--fav-color); }
        .btn.attach { background-color: #4a69bd; }
        
        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: var(--tg-theme-hint-color, #8e8e93);
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            line-height: 1.6;
        }

        /* Modal الملحقات */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: var(--card-bg); padding: 20px; border-radius: 12px; width: 85%; max-width: 400px;
            max-height: 80vh; overflow-y: auto; text-align: center; border: 1px solid var(--border-color);
        }
        .attach-link {
            display: block; padding: 10px 12px; background-color: #3a3a3c;
            color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.2s;
        }
        .attach-link:hover { background-color: var(--accent-color); }
        .close-btn { margin-top: 15px; padding: 10px 20px; background-color: #e74c3c; border: none; color: white; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>قائمتك الاستشارية</h2>
    </div>

    <div class="tabs">
        <button id="tab-btn-short" class="tab-btn active" onclick="switchTab('short')">👌🏻 أهم 7</button>
        <button id="tab-btn-long" class="tab-btn" onclick="switchTab('long')">👍🏻 المخصصة لك</button>
        <button id="tab-btn-all" class="tab-btn" onclick="switchTab('all')">🤝🏻 الشاملة</button>
        <button id="tab-btn-fav" class="tab-btn fav-tab" onclick="switchTab('fav')" title="المفضلة (مهتم)">⭐</button>
    </div>

    <div style="background: #3a3a3c; border-radius: 10px; height: 8px; margin-bottom: 20px; position: sticky; top: 10px; z-index: 100;">
        <div id="progress-bar" style="background: var(--accent-color); width: 0%; height: 100%; border-radius: 10px; transition: 0.3s;"></div>
    </div>

    <div id="short-content" class="tab-content active"></div>
    <div id="long-content" class="tab-content"></div>
    <div id="all-content" class="tab-content"></div>
    <div id="fav-content" class="tab-content"></div>

    <!-- نافذة الملحقات (Modal) -->
    <div id="attachModal" class="modal" onclick="if(event.target === this) this.style.display='none'">
        <div class="modal-content">
            <h3 style="margin-top:0;">ملحقات الفيديو</h3>
            <div id="attachLinksContainer"></div>
            <button class="close-btn" onclick="document.getElementById('attachModal').style.display='none'">إغلاق</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // --- إعدادات الاتصال بالخلفية ---
        const API_BASE = "https://api.hanygharba.com";
        const TELEGRAM_ID = tg.initDataUnsafe?.user?.id || 0;
        const INIT_DATA = tg.initData || "";
        
        // متغيرات حفظ الحالة والبيانات محلياً
        let watchedVideos = [];
        let favoriteVideos = [];
        let allVideosGlobal = [];

        // دالة توحيد المعرفات: تحول "001" أو 1 إلى "1"، وتبقي "[Intro_1]" كما هي بدون NaN
        function normalizeId(val) {
            if (val === null || val === undefined) return "";
            const s = String(val).trim();
            if (!s) return "";
            const num = Number(s);
            return !isNaN(num) ? String(num) : s;
        }

        // دالة استخراج الملحقات من الفيديو (تدعم attachments_list الجاهزة أو الأعمدة الـ 3 مباشرة)
        function getVideoAttachments(videoData) {
            if (Array.isArray(videoData.attachments_list) && videoData.attachments_list.length > 0) {
                return videoData.attachments_list;
            }
            const rawNames = String(videoData.attachments || "").trim();
            if (!rawNames || rawNames.toLowerCase() === "nan") return [];

            const splitField = (str) => {
                if (!str || String(str).trim().toLowerCase() === "nan") return [];
                return String(str).split(/\s*\|\s*|\r?\n/)
                    .map(s => s.replace(/^[•\-*]\s*/, '').trim())
                    .filter(s => s && s.toLowerCase() !== "nan");
            };

            const names = splitField(videoData.attachments);
            const urls = splitField(videoData.attachments_urls);
            const descs = splitField(videoData.attachments_describtion);

            return names.map((name, idx) => ({
                name: name,
                link: idx < urls.length ? urls[idx] : "",
                description: idx < descs.length ? descs[idx] : ""
            }));
        }

        // تحديث شريط التقدم للتبويب النشط
        function updateProgress() {
            const activeContent = document.querySelector('.tab-content.active');
            if (!activeContent) return;
            const total = activeContent.querySelectorAll('.btn.watched').length;
            const completed = activeContent.querySelectorAll('.btn.watched.active').length;
            document.getElementById('progress-bar').style.width = (total > 0 ? (completed / total) * 100 : 0) + '%';
        }

        // تحديث محتوى تبويب المفضلة (⭐) بشكل ديناميكي
        function renderFavoritesTab() {
            const favContainer = document.getElementById('fav-content');
            if (!favContainer) return;
            renderVideoCards(
                favoriteVideos,
                allVideosGlobal,
                favContainer,
                "⭐ لم تقم بإضافة أي فيديوهات لقائمة المهتمين بعد.<br><small>اضغط على زر «📌 مهتم» أسفل أي فيديو ليظهر لك هنا مباشرة.</small>"
            );
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            const targetBtn = document.getElementById(`tab-btn-${tabName}`);
            const targetContent = document.getElementById(`${tabName}-content`);
            
            if (targetBtn) targetBtn.classList.add('active');
            if (targetContent) targetContent.classList.add('active');

            if (tabName === 'fav') {
                renderFavoritesTab();
            }
            updateProgress();
        }

        // إرسال التحديث للسيرفر + تحديث كل الأزرار المكررة + تحديث تبويب ⭐ + الحفظ المحلي
        async function toggleAction(clickedButton, videoId, actionType) {
            const normId = normalizeId(videoId);
            const isCurrentlyActive = clickedButton.classList.contains('active');
            const willBeActive = !isCurrentlyActive;

            if (actionType === 'watched') {
                if (willBeActive) {
                    if (!watchedVideos.includes(normId)) watchedVideos.push(normId);
                } else {
                    watchedVideos = watchedVideos.filter(id => id !== normId);
                }
                localStorage.setItem(`watched_${TELEGRAM_ID}`, JSON.stringify(watchedVideos));
            } else {
                if (willBeActive) {
                    if (!favoriteVideos.includes(normId)) favoriteVideos.push(normId);
                } else {
                    favoriteVideos = favoriteVideos.filter(id => id !== normId);
                }
                localStorage.setItem(`fav_${TELEGRAM_ID}`, JSON.stringify(favoriteVideos));
            }

            // تحديث حالة جميع الأزرار المطابقة لهذا الفيديو في كافة التبويبات
            const allRelatedButtons = document.querySelectorAll(`button[data-id="${CSS.escape(normId)}"]`);
            allRelatedButtons.forEach(btn => {
                if (btn.classList.contains(actionType === 'watched' ? 'watched' : 'fav')) {
                    if (willBeActive) {
                        btn.classList.add('active');
                        btn.innerText = actionType === 'watched' ? '✅ شاهدته' : '⭐ مهتم';
                    } else {
                        btn.classList.remove('active');
                        btn.innerText = actionType === 'watched' ? '✔️ شاهدته' : '📌 مهتم';
                    }
                }
            });

            // إعادة بناء قائمة ⭐ فوراً عند تعديل المفضلة
            if (actionType === 'favorite') {
                renderFavoritesTab();
            }

            updateProgress();

            const payloadVideoId = !isNaN(Number(normId)) ? Number(normId) : normId;

            try {
                await fetch(`${API_BASE}/toggle_action`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': INIT_DATA
                    },
                    body: JSON.stringify({
                        telegram_id: TELEGRAM_ID,
                        video_id: payloadVideoId,
                        action_type: actionType
                    })
                });
            } catch(e) {
                console.warn("السيرفر غير متصل، تم حفظ الحالة محلياً بنجاح.");
            }
        }

        // عرض الملحقات في نافذة منبثقة بأمان تام ضد XSS
        function openAttachments(attachmentsJson) {
            const container = document.getElementById('attachLinksContainer');
            container.innerHTML = "";
            let attachments = [];
            try {
                attachments = JSON.parse(decodeURIComponent(attachmentsJson));
            } catch (e) {
                console.error("Failed to parse attachments:", e);
            }
            
            attachments.forEach(att => {
                const itemDiv = document.createElement('div');
                itemDiv.style.marginBottom = "14px";
                itemDiv.style.textAlign = "right";
                
                if (att.link && att.link.trim() !== "") {
                    let a = document.createElement('a');
                    a.className = 'attach-link';
                    a.href = att.link.trim();
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.textContent = `🔗 ${att.name || 'ملحق'}`;
                    itemDiv.appendChild(a);
                } else {
                    let span = document.createElement('div');
                    span.className = 'attach-link';
                    span.style.opacity = "0.85";
                    span.textContent = `📄 ${att.name || 'ملحق'}`;
                    itemDiv.appendChild(span);
                }

                if (att.description && att.description.trim() !== "") {
                    let desc = document.createElement('div');
                    desc.style.fontSize = "12px";
                    desc.style.color = "var(--tg-theme-hint-color, #8e8e93)";
                    desc.style.marginTop = "5px";
                    desc.style.paddingRight = "4px";
                    desc.style.lineHeight = "1.4";
                    desc.textContent = att.description;
                    itemDiv.appendChild(desc);
                }

                container.appendChild(itemDiv);
            });
            document.getElementById('attachModal').style.display = 'flex';
        }

        // بناء بطاقات الفيديوهات مقسمة إلى مجموعات (طي/فرد)
        function renderVideoCards(idsArray, allVideosData, containerElement, emptyMessage = "لا توجد فيديوهات في هذه القائمة.") {
            containerElement.innerHTML = "";
            if (!idsArray || idsArray.length === 0) {
                containerElement.innerHTML = `<div class="empty-state">${emptyMessage}</div>`;
                return;
            }

            // فلترة القائمة للإبقاء على الفيديوهات الموجودة والتي لها رابط فقط
            const validItems = [];
            idsArray.forEach(rawId => {
                const normId = normalizeId(rawId);
                const videoData = allVideosData.find(v => normalizeId(v.id) === normId);
                if (videoData && (videoData['bunny link'] || videoData.link) && String(videoData['bunny link'] || videoData.link).trim().toLowerCase() !== "nan") {
                    validItems.push({ normId, videoData });
                }
            });

            if (validItems.length === 0) {
                containerElement.innerHTML = `<div class="empty-state">${emptyMessage}</div>`;
                return;
            }

            const chunkSize = 10;
            for (let i = 0; i < validItems.length; i += chunkSize) {
                const chunk = validItems.slice(i, i + chunkSize);
                
                const details = document.createElement('details');
                if (i === 0) details.open = true; 
                
                const summary = document.createElement('summary');
                summary.className = 'group-summary';
                summary.innerText = `مجموعة ${(i/chunkSize)+1} (${chunk.length} فيديوهات)`;
                details.appendChild(summary);

                chunk.forEach((item, index) => {
                    const { normId, videoData } = item;
                    const card = document.createElement('div');
                    card.className = 'card';
                    let videoLink = String(videoData['bunny link'] || videoData.link).trim();
                    let safeLinkHtml = "";
                    
                    if (videoLink.startsWith("http")) {
                        let embedUrl = videoLink.replace("/play/", "/embed/");
                        safeLinkHtml = `<div style="position:relative;padding-top:56.25%;"><iframe src="${embedUrl}?autoplay=false&loop=false&muted=false&preload=false&responsive=true" loading="lazy" style="border:0;position:absolute;top:0;height:100%;width:100%;" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;" allowfullscreen="true"></iframe></div>`;
                    } else {
                        safeLinkHtml = videoLink.replace("autoplay=true", "autoplay=false");
                    }
                    
                    const isWatched = watchedVideos.includes(normId);
                    const isFav = favoriteVideos.includes(normId);
                    
                    // تأمين النص ضد علامات الاقتباس المفردة لتجنب كسر onclick
                    const safeNormId = normId.replace(/'/g, "\\'");
                    const attachments = getVideoAttachments(videoData);
                    let attachBtnHtml = "";
                    if (attachments.length > 0) {
                        const attData = encodeURIComponent(JSON.stringify(attachments)).replace(/'/g, "%27");
                        attachBtnHtml = `<button class="btn attach" onclick="openAttachments('${attData}')">🔗 ملحقات</button>`;
                    }
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'video-title';
                    titleDiv.textContent = `${(i + index + 1)}. ${videoData.question || ''}`;
                    
                    const videoContainerDiv = document.createElement('div');
                    videoContainerDiv.className = 'video-container';
                    videoContainerDiv.innerHTML = safeLinkHtml;
                    
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'actions';
                    actionsDiv.innerHTML = `
                        <button class="btn watched ${isWatched ? 'active' : ''}" data-id="${normId}" onclick="toggleAction(this, '${safeNormId}', 'watched')">
                            ${isWatched ? '✅ شاهدته' : '✔️ شاهدته'}
                        </button>
                        <button class="btn fav ${isFav ? 'active' : ''}" data-id="${normId}" onclick="toggleAction(this, '${safeNormId}', 'favorite')">
                            ${isFav ? '⭐ مهتم' : '📌 مهتم'}
                        </button>
                        ${attachBtnHtml}
                    `;

                    card.appendChild(titleDiv);
                    card.appendChild(videoContainerDiv);
                    card.appendChild(actionsDiv);
                    details.appendChild(card);
                });
                containerElement.appendChild(details);
            }
        }

        async function fetchVideosData() {
            // كاش ساعي بدلاً من كل ثانية لتوفير الباقة وتسريع التحميل
            const cacheHour = Math.floor(Date.now() / 3600000);
            try {
                // محاولة الجلب من نفس النطاق أولاً (أسرع وأضمن)
                const localRes = await fetch(`./qa_data.json?v=${cacheHour}`);
                if (localRes.ok) return await localRes.json();
            } catch (e) {}
            // البديل الاحتياطي من GitHub Raw
            const ghRes = await fetch(`https://raw.githubusercontent.com/hanygharba/Bot-mini-app/main/qa_data.json?v=${cacheHour}`);
            return await ghRes.json();
        }

        async function initApp() {
            try {
                const lw = localStorage.getItem(`watched_${TELEGRAM_ID}`);
                const lf = localStorage.getItem(`fav_${TELEGRAM_ID}`);
                if (lw) watchedVideos = JSON.parse(lw).map(normalizeId);
                if (lf) favoriteVideos = JSON.parse(lf).map(normalizeId);
            } catch (e) {}

            try {
                if (TELEGRAM_ID !== 0) {
                    const stateRes = await fetch(`${API_BASE}/user_state/${TELEGRAM_ID}`, {
                        headers: { 'X-Telegram-Init-Data': INIT_DATA }
                    });
                    if (stateRes.ok) {
                        const stateData = await stateRes.json();
                        watchedVideos = (stateData.watched || []).map(normalizeId);
                        favoriteVideos = (stateData.favorites || []).map(normalizeId);
                        
                        localStorage.setItem(`watched_${TELEGRAM_ID}`, JSON.stringify(watchedVideos));
                        localStorage.setItem(`fav_${TELEGRAM_ID}`, JSON.stringify(favoriteVideos));
                    }
                }
            } catch (e) {
                console.warn("تعذر الاتصال بالسيرفر، جاري الاعتماد على الذاكرة المحلية فقط.");
            }

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const shortIds = urlParams.get('s') ? urlParams.get('s').split(',').map(normalizeId).filter(Boolean) : [];
                const longIds = urlParams.get('l') ? urlParams.get('l').split(',').map(normalizeId).filter(Boolean) : [];

                allVideosGlobal = await fetchVideosData();
                const allIds = allVideosGlobal.map(v => normalizeId(v.id)).filter(id => !id.startsWith("[Intro_"));

                renderVideoCards(shortIds, allVideosGlobal, document.getElementById('short-content'));
                renderVideoCards(longIds, allVideosGlobal, document.getElementById('long-content'));
                renderVideoCards(allIds, allVideosGlobal, document.getElementById('all-content'));
                renderFavoritesTab();

                updateProgress();
            } catch (error) {
                console.error("Error loading app:", error);
                document.getElementById('short-content').innerHTML = "<h3 style='text-align:center;'>حدث خطأ أثناء تحميل الفيديوهات.</h3>";
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
