<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطة الاستشارة وقائمة التشغيل</title>
    <!-- مكتبة تليجرام الرسمية للـ Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1d);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --accent-color: var(--tg-theme-button-color, #2a9d8f);
            --border-color: #3a3a3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 5px 0;
            font-size: 20px;
        }
        .header p {
            font-size: 13px;
            color: #a1a1aa;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }
        .video-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .video-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            background-color: #000;
        }
        video {
            width: 100%;
            display: block;
            outline: none;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-status {
            background-color: #3a3a3c;
            color: #ffffff;
            width: 100%;
        }
        .btn-status.completed {
            background-color: var(--accent-color);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <script>
        // 1. تهيئة تطبيق تيليجرام
        let tg = window.Telegram.WebApp;
        tg.expand();

        // 2. دالة تغيير حالة المشاهدة (UI فقط حالياً)
        function toggleStatus(button) {
            if (button.classList.contains('completed')) {
                button.classList.remove('completed');
                button.innerText = 'تمت المشاهدة ✓';
                button.style.backgroundColor = '#3a3a3c';
            } else {
                button.classList.add('completed');
                button.innerText = 'تمت المشاهدة ✓ (مكتمل)';
                button.style.backgroundColor = '#2a9d8f';
            }
        }

        // 3. دالة لجلب البيانات وبناء الفيديوهات
        async function loadPlaylists() {
            try {
                // استخراج الأرقام من الرابط (Query Parameters)
                const urlParams = new URLSearchParams(window.location.search);
                const shortIdsStr = urlParams.get('s'); // سيأخذ الأرقام الممررة من البوت
                
                // للتبسيط والتجربة: إذا فتحت الرابط مباشرة بدون بوت سيعرض لك فيديوهات تجريبية
                const idsToLoad = shortIdsStr ? shortIdsStr : "1,2"; 
                const shortIds = idsToLoad.split(',').map(id => parseInt(id.trim()));

                // جلب قاعدة البيانات المصغرة (JSON) 
                // تأكد من رفع ملف qa_data.json بجوار ملف index.html على جيت هب
                const response = await fetch('https://raw.githubusercontent.com/hanygharba/Bot-mini-app/main/qa_data.json');
                const allVideos = await response.json();

                const container = document.body;
                
                // تجهيز ترويسة الصفحة
                container.innerHTML = `
                    <div class="header">
                        <h2>قائمتك الاستشارية المخصصة</h2>
                        <p>القائمة العاجلة بناءً على تشخيص مشروعك</p>
                    </div>
                `;

                // بناء بطاقة لكل فيديو موجود في القائمة المختصرة
                shortIds.forEach((id, index) => {
                    const videoData = allVideos.find(v => parseInt(v.id) === id);
                    
                    if (videoData && videoData.link) {
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        // تعديل مهم: سنقوم بتحويل autoplay=true إلى autoplay=false برمجياً 
                        // حتى لا تعمل كل الفيديوهات الـ 7 معاً في نفس الوقت وتسبب إزعاجاً للعميل
                        const safeLinkHtml = videoData.link.replace("autoplay=true", "autoplay=false");

                        card.innerHTML = `
                            <div class="video-title">${index + 1}. ${videoData.question}</div>
                            
                            <div class="video-container">
                                ${safeLinkHtml} 
                            </div>
                            
                            <div class="actions">
                                <button class="btn btn-status" onclick="toggleStatus(this)">علامة كـ مقروء ✓</button>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                });

            } catch (error) {
                console.error("Error loading playlist:", error);
                document.body.innerHTML = "<h3 style='text-align:center;'>حدث خطأ أثناء تحميل الفيديوهات. تأكد من رفع ملف qa_data.json.</h3>";
            }
        }

        // تشغيل الدالة فور تحميل الصفحة
        window.onload = loadPlaylists;
    </script>
</body>
</html>
