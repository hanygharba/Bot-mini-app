<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطة الاستشارة وقائمة التشغيل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1d);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --accent-color: var(--tg-theme-button-color, #2a9d8f);
            --border-color: #3a3a3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 5px 0;
            font-size: 20px;
        }
        .header p {
            font-size: 13px;
            color: #a1a1aa;
            margin: 0;
        }

        /* تنسيق التبويبات (Tabs) */
        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--accent-color);
            color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }
        .video-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .video-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            background-color: #000;
        }
        video {
            width: 100%;
            display: block;
            outline: none;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-status {
            background-color: #3a3a3c;
            color: #ffffff;
            width: 100%;
        }
        .btn-status.completed {
            background-color: var(--accent-color);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>قائمتك الاستشارية</h2>
    </div>

    <!-- أزرار التبويبات المحدثة -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('short')">👌🏻 أهم 7</button>
        <button class="tab-btn" onclick="switchTab('long')">👍🏻 المخصصة لك</button>
        <button class="tab-btn" onclick="switchTab('all')">🤝🏻 الشاملة</button>
    </div>

    <!-- شريط التقدم (ثابت في الأعلى) -->
    <div style="background: #3a3a3c; border-radius: 10px; height: 8px; margin-bottom: 20px; position: sticky; top: 10px; z-index: 100;">
        <div id="progress-bar" style="background: var(--accent-color); width: 0%; height: 100%; border-radius: 10px; transition: 0.3s;"></div>
    </div>

    <!-- حاويات الفيديوهات -->
    <div id="short-content" class="tab-content active"></div>
    <div id="long-content" class="tab-content"></div>
    <div id="all-content" class="tab-content"></div> <!-- حاوية القائمة الشاملة -->

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // دالة تحديث شريط التقدم
        function updateProgress() {
            // البحث عن التبويب النشط حالياً
            const activeContent = document.querySelector('.tab-content.active');
            if (!activeContent) return;

            // حساب عدد الأزرار الكلية وعدد الأزرار المكتملة في التبويب النشط
            const totalButtons = activeContent.querySelectorAll('.btn-status').length;
            const completedButtons = activeContent.querySelectorAll('.btn-status.completed').length;
            
            // حساب النسبة المئوية
            let percentage = 0;
            if (totalButtons > 0) {
                percentage = (completedButtons / totalButtons) * 100;
            }
            
            // تحديث عرض شريط التقدم
            document.getElementById('progress-bar').style.width = percentage + '%';
        }

        function toggleStatus(button) {
            if (button.classList.contains('completed')) {
                button.classList.remove('completed');
                button.innerText = '✔️ شاهدته';
                button.style.backgroundColor = '#3a3a3c';
            } else {
                button.classList.add('completed');
                button.innerText = '✅ شاهدته';
                button.style.backgroundColor = 'var(--accent-color)';
            }
            // تحديث شريط التقدم عند الضغط على الزر
            updateProgress();
        }

        function switchTab(tabName) {
            // إزالة الأكتيف من كل الأزرار والمحتوى
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // إضافة الأكتيف للتبويب المطلوب وإظهار المحتوى الخاص به
            if(tabName === 'short') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('short-content').classList.add('active');
            } else if(tabName === 'long') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('long-content').classList.add('active');
            } else if(tabName === 'all') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('all-content').classList.add('active');
            }
            
            // تحديث شريط التقدم فور التبديل ليعكس حالة التبويب الجديد
            updateProgress();
        }

        function renderVideoCards(idsArray, allVideosData, containerElement) {
            if (!idsArray || idsArray.length === 0) {
                containerElement.innerHTML = "<p style='text-align:center;'>لا توجد فيديوهات في هذه القائمة.</p>";
                return;
            }

            idsArray.forEach((id, index) => {
                const videoData = allVideosData.find(v => parseInt(v.id) === id);
                if (videoData && videoData.link) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const safeLinkHtml = videoData.link.replace("autoplay=true", "autoplay=false");
                    
                    card.innerHTML = `
                        <div class="video-title">${index + 1}. ${videoData.question}</div>
                        <div class="video-container">
                            ${safeLinkHtml} 
                        </div>
                        <div class="actions">
                            <button class="btn btn-status" onclick="toggleStatus(this)">✔️ شاهدته</button>
                        </div>
                    `;
                    containerElement.appendChild(card);
                }
            });
        }

        async function loadPlaylists() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const shortIdsStr = urlParams.get('s'); 
                const longIdsStr = urlParams.get('l'); 
                
                if (!shortIdsStr && !longIdsStr) {
                    document.getElementById('short-content').innerHTML = "<h3 style='text-align:center;'>لم يتم العثور على قوائم مخصصة. يرجى إنهاء التشخيص أولاً.</h3>";
                    return;
                }

                // تحويل النصوص إلى مصفوفات أرقام
                const shortIds = shortIdsStr ? shortIdsStr.split(',').map(id => parseInt(id.trim())) : [];
                const longIds = longIdsStr ? longIdsStr.split(',').map(id => parseInt(id.trim())) : [];

                const response = await fetch('https://raw.githubusercontent.com/hanygharba/Bot-mini-app/main/qa_data.json');
                const allVideos = await response.json();

                // بناء واجهة القائمة العاجلة
                renderVideoCards(shortIds, allVideos, document.getElementById('short-content'));
                
                // بناء واجهة القائمة المطولة
                renderVideoCards(longIds, allVideos, document.getElementById('long-content'));

                // بناء واجهة القائمة الشاملة (استخراج جميع الـ IDs من كل الفيديوهات)
                const allIds = allVideos.map(v => parseInt(v.id));
                renderVideoCards(allIds, allVideos, document.getElementById('all-content'));

                // تحديث شريط التقدم للتبويب النشط افتراضياً عند التحميل
                updateProgress();

            } catch (error) {
                console.error("Error loading playlist:", error);
                document.getElementById('short-content').innerHTML = "<h3 style='text-align:center;'>حدث خطأ أثناء تحميل الفيديوهات.</h3>";
            }
        }

        window.onload = loadPlaylists;
    </script>
</body>
</html>
