<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطة الاستشارة وقائمة التشغيل</title>
    <!-- مكتبة تليجرام الرسمية للـ Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1d); /* لون داكن يتناسب مع تيليجرام */
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --accent-color: var(--tg-theme-button-color, #2a9d8f);
            --border-color: #3a3a3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 5px 0;
            font-size: 20px;
        }
        .header p {
            font-size: 13px;
            color: #a1a1aa;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }
        .video-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        /* تنسيق حاوية مشغل الفيديو */
        .video-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            background-color: #000; /* خلفية سوداء للمشغل */
        }
        
        video {
            width: 100%;
            display: block;
            outline: none;
        }

        .actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-status {
            background-color: #3a3a3c;
            color: #ffffff;
            width: 100%;
        }
        .btn-status.completed {
            background-color: var(--accent-color);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>قائمتك الاستشارية المخصصة</h2>
        <p>شاهد الفيديوهات وتابع تقدمك مباشرة من هنا</p>
    </div>

    <!-- بطاقة فيديو مدمج 1 -->
    <div class="card">
        <div class="video-title">1. كيف تحدد مرحلة مشروعي بدقة؟</div>
        
        <!-- مشغل الفيديو المدمج -->
        <div class="video-container">
            <!-- وضعنا رابط mp4 تجريبي لترى المشغل يعمل -->
            <video controls preload="metadata" width="100%">
                <source src="https://drive.google.com/file/d/1XbupEjLwiBhfuaqsSLYq9O_gch7ZlvPZ/view?usp=drive_link" type="video/mp4">
                عذراً، متصفحك لا يدعم تشغيل الفيديو.
            </video>
            <video controls preload="metadata">
                <source src="https://iframe.mediadelivery.net/play/221483/d4409caf-b2c9-4b4d-afa4-1894819c421e" type="video/mp4">
                عذراً، متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <div class="actions">
            <button class="btn btn-status" onclick="toggleStatus(this)">تمت المشاهدة ✓</button>
        </div>
    </div>

    <!-- بطاقة فيديو مدمج 2 -->
    <div class="card">
        <div class="video-title">2. هيكلة الإدارة وفخ التشغيل اليومي</div>
        
        <div class="video-container">
            <!-- وضعنا رابط mp4 تجريبي لترى المشغل يعمل -->
            <video controls preload="metadata">
                <source src="<div style="position:relative;padding-top:56.25%;"><iframe src="https://iframe.mediadelivery.net/embed/221483/d4409caf-b2c9-4b4d-afa4-1894819c421e?autoplay=true&loop=false&muted=true&preload=false&responsive=true" loading="lazy" style="border:0;position:absolute;top:0;height:100%;width:100%;" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;" allowfullscreen="true"></iframe></div>" type="video/mp4">
                عذراً، متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <div class="actions">
            <button class="btn btn-status" onclick="toggleStatus(this)">تمت المشاهدة ✓</button>
        </div>
    </div>

    <script>
        // تهيئة تطبيق تيليجرام
        let tg = window.Telegram.WebApp;
        tg.expand();

        // دالة تغيير حالة المشاهدة
        function toggleStatus(button) {
            if (button.classList.contains('completed')) {
                button.classList.remove('completed');
                button.innerText = 'تمت المشاهدة ✓';
                button.style.backgroundColor = '#3a3a3c';
            } else {
                button.classList.add('completed');
                button.innerText = 'تمت المشاهدة ✓ (مكتمل)';
                button.style.backgroundColor = '#2a9d8f';
            }
        }
    </script>
</body>
</html>
